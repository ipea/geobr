[project]
name = "geobr"
version = "2.0.2"
description = "geobr: Download Official Spatial Data Sets of Brazil"
readme = "README.md"
requires-python = "<4.0,>=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "João Carabetta"},
    {name = "Rafael H. M. Pereira"},
    {name = "Camila Gonçalves de Brito"},
    {name = "Rogério Jerônimo Barbosa"},
    {name = "Caio Nogueira Goncalves"},
    {name = "Bernardo Furtado"},
]
dependencies = [
    "geopandas>=1.0.0,<2",
    "shapely>=1.7.0,<3",
    "requests<3.0.0,>=2.25.1",
    "urllib3>=1.26.0,<3.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.5.3",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
homepage = "https://github.com/ipea/geobr"
repository = "https://github.com/ipea/geobr"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = [
    "geobr",
    "geobr/data",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | helpers/template
)
'''

[dependency-groups]
dev = [
    "pytest>=6.0,<10.0",
    "pytest-xdist>=3.5.0",
    "jinja2<4.0.0,>=3.1.4",
    "fire<1.0.0,>=0.5.0",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that download data from the internet",
]
